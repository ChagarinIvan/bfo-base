name: Agent PR review

# Trusted workflow/controls only. Candidate checkout is read as data, never executed.
on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        role: [architecture, ddd, security, tests, frontend, uiux]
    steps:
      - name: Checkout trusted controls
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout candidate as data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Require review credentials
        env:
          REVIEW_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$REVIEW_KEY" ]; then
            echo '::error::Configure OPENAI_API_KEY repository secret to enable agent reviews.'
            exit 1
          fi
      - name: Prepare trusted role prompt
        working-directory: trusted
        env:
          REVIEW_ROLE: ${{ matrix.role }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
        run: node .github/review/review.cjs
      - name: Prepare isolated reviewer account
        working-directory: trusted
        env:
          REVIEW_ROLE: ${{ matrix.role }}
        run: bash .github/review/prepare-user.sh
      - name: Review candidate source
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: ${{ github.workspace }}/trusted
          prompt-file: ${{ runner.temp }}/review-prompt.md
          output-schema-file: ${{ github.workspace }}/trusted/.github/review/report.schema.json
          output-file: ${{ runner.temp }}/codex-output/${{ matrix.role }}.json
          sandbox: read-only
          safety-strategy: unprivileged-user
          codex-user: codex-review
          model: ${{ vars.CODEX_REVIEW_MODEL }}
          effort: medium
      - name: Preserve role result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-${{ matrix.role }}
          path: |
            ${{ runner.temp }}/codex-output/${{ matrix.role }}.json
            ${{ runner.temp }}/codex-output/${{ matrix.role }}-context.json
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: review
    if: >-
      always() && !cancelled() &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Download role reports
        continue-on-error: true # Missing artifacts are errors in the published report.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: review-*
          path: ${{ runner.temp }}/role-reports
      - name: Validate and publish report
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REPORTS_DIR: ${{ runner.temp }}/role-reports
        with:
          script: |
            const { runPublisher } = require('./.github/review/review.cjs');
            await runPublisher({ github, context, core });
